# Runs the jest suite (engine, invariants, server referee, online client, UI) on every push to
# main/dev and on every pull request. Releases (npm run ship -- prod) run the same tests locally.
name: tests
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx jest --ci
